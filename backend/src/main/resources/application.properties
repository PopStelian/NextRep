spring.application.name=NextRep

# Production profile for Render - PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Hibernate 7 uses the generic PostgreSQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}
server.address=0.0.0.0

jwt.secret=${JWT_SECRET:your_secret_key_that_must_be_at_least_32_characters_long_for_HS256_algorithm}
jwt.expiration=${JWT_EXPIRATION:3600000}



