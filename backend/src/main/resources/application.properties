spring.application.name=NextRep
# Connection settings - use existing SSMS database NextRep
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=NextRep;encrypt=true;trustServerCertificate=true;integratedSecurity=false}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.microsoft.sqlserver.jdbc.SQLServerDriver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:Stelian}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:stelianpop1}

# Hibernate - create/update tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Disable Flyway migrations (we'll let Hibernate update the schema against the existing SSMS DB)
spring.flyway.enabled=false

# Server port - HTTP for DEV
server.port=${PORT:8081}
server.address=0.0.0.0


# JWT Configuration
jwt.secret=your_secret_key_that_must_be_at_least_32_characters_long_for_HS256_algorithm
jwt.expiration=3600000

# Session management
server.servlet.session.timeout=30m
management.endpoints.web.exposure.include=health,info
