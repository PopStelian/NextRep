spring.application.name=NextRep

# Production profile for Render
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:${H2_DB_PATH:./data/nextrepdb};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.enabled=false

server.port=${PORT:8080}
server.address=0.0.0.0

jwt.secret=${JWT_SECRET:change-me-in-production}
jwt.expiration=${JWT_EXPIRATION:3600000}

management.endpoints.web.exposure.include=health,info

