spring.application.name=NextRep
# Connection settings - use existing SSMS database NextRep
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=NextRep;encrypt=true;trustServerCertificate=true;integratedSecurity=false
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=Stelian
spring.datasource.password=stelianpop1

# Hibernate - create/update tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Disable Flyway migrations (we'll let Hibernate update the schema against the existing SSMS DB)
spring.flyway.enabled=false

# Server port
server.port=8081

